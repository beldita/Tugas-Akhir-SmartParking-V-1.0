services:
  # 1. RELATIONAL DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: smartparking-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: smart_parking
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - parking_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d smart_parking"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. IN-MEMORY CACHE & QUEUE (CRITICAL FOR IOT)
  redis:
    image: redis:7-alpine
    container_name: smartparking-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - parking_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 3. MQTT BROKER (IOT COMMUNICATION)
  emqx:
    image: emqx/emqx:5.3.0
    container_name: smartparking-emqx
    environment:
      TZ: Asia/Jakarta
    ports:
      - "1883:1883"       # MQTT TCP
      - "8083:8083"       # MQTT over WebSocket
      - "18083:18083"     # Admin Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - parking_net
    restart: unless-stopped

  # 4. BACKEND API (LARAVEL)
  laravel:
    build:
      context: ./docker/laravel
    container_name: smartparking-laravel
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./backend/laravel:/var/www
    networks:
      - parking_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 5. WEB SERVER (NGINX)
  nginx:
    image: nginx:alpine
    container_name: smartparking-nginx
    environment:
      TZ: Asia/Jakarta
    ports:
      - "8000:80"
    volumes:
      - ./backend/laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - parking_net
    depends_on:
      - laravel
    restart: unless-stopped

  # 6. AI/ALGORITHM ENGINE (PYTHON)
  algorithm:
    build:
      context: .
      dockerfile: ./docker/python/Dockerfile
    container_name: smartparking-algorithm
    environment:
      TZ: Asia/Jakarta
    ports:
      - "8001:8001"
    volumes:
      - ./algorithm:/app
    networks:
      - parking_net
    restart: unless-stopped

networks:
  parking_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  emqx_data:
  emqx_log:

